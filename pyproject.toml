[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offset-diff"
version = "0.1.0"
description = "Diff game offset dumps (cs2-dumper, a2x, Dumper-7 style) across builds."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
offset-diff = "offset_diff.cli:main"

[tool.setuptools]
packages = ["offset_diff"]
